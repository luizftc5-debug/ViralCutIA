[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "viralcut"
version = "0.1.0"
description = "ViralCut AI — turns long videos into ranked, captioned, vertical short-form clips."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "numpy>=1.26",
  "opencv-python-headless>=4.10,<5",
  "pillow>=10",
  "faster-whisper>=1.1,<2",
]

[project.optional-dependencies]
llm = ["anthropic>=0.60"]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
viralcut-worker = "viralcut.worker.main:main"
viralcut-cli = "viralcut.cli:main"

[tool.setuptools.packages.find]
include = ["viralcut*"]

[tool.setuptools.package-data]
viralcut = ["assets/fonts/*", "assets/models/*", "assets/licenses/*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs ffmpeg with libflite and downloads the Whisper model (deselect with -m 'not integration')",
]
